{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<main class="mx-4 my-5">

    <section>
        <div class="container">

            <div class="row justify-content-center">
                <div class="col-5">

                    <div class="bg-white rounded-5 shadow p-5">

                        <div class="text-center mb-5">
                            <p class="lecce-text-impact lecce-primary-color my-2 fs-6 fw-semibold">
                                WELCOME BACK!
                            </p>

                            <h1 class="display-6 fw-bold lecce-text-impact lecce-secondary-color">
                                Log in to LecC'È
                            </h1>

                        </div>

                        <form method="POST" action="{{ url_for('login_post') }}">

                            <div class="mt-3">
                                <label for="email" class="form-label fw-semibold lecce-secondary-color">
                                    <i class="bi bi-envelope me-1"></i>
                                    Email <span class="lecce-primary-color">*</span>
                                </label>

                                <input type="email" class="form-control rounded-4 py-3" id="email" name="email"
                                    placeholder="email@email.com" required>
                            </div>

                            <div class="mt-3">
                                <label for="password" class="form-label fw-semibold lecce-secondary-color">
                                    <i class="bi bi-lock me-1"></i>
                                    Password <span class="lecce-primary-color">*</span>
                                </label>

                                <input type="password" class="form-control rounded-4 py-3" id="password" name="password"
                                    required>
                            </div>

                            <button type="submit"
                                class="btn lecce-btn lecce-primary-background py-3 mt-4 fw-bold shadow w-100">
                                Log In
                            </button>

                            <p class="fs-6 mt-4 mb-0">
                                Don't you have an account?
                                <a href="{{ url_for('register') }}"
                                    class="lecce-primary-color fw-bold text-decoration-none">
                                    Sign up
                                </a>
                            </p>
                        </form>

                    </div>

                </div>
            </div>

        </div>
    </section>

</main>
{% endblock %}
