<form class="lecce-secondary-background rounded-4 shadow-lg p-4 mt-3" action="{{ url_for('tours') }}" id="collapseFilters">
    <div class="row g-4">

        <div class="col-4">
            <label for="weekday" class="form-label">Day of week</label>
            <select class="form-select" id="weekday" name="weekday">
                <option value="Any day">Any day</option>
                <option value="monday">Monday</option>
                <option value="tuesday">Tuesday</option>
                <option value="wednesday">Wednesday</option>
                <option value="thursday">Thursday</option>
                <option value="friday">Friday</option>
                <option value="saturday">Saturday</option>
                <option value="sunday">Sunday</option>
            </select>
        </div>

        <div class="col-4">
            <label for="duration" class="form-label">Duration</label>
            <select class="form-select" id="duration" name="duration">
                <option value="Any duration">Any duration</option>
                <option value="0 - 1:30 h">0 - 1:30 h</option>
                <option value="1:30 - 3 h">1:30 - 3 h</option>
                <option value="3 h +">3 h +</option>
            </select>
        </div>

        <div class="col-4">
            <label for="language" class="form-label">Language</label>
            <select class="form-select" id="language" name="language">
                <option value="Any language">Any language</option>
                {% for language in languages %}
                <option value="{{ language.name }}">{{ language.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-4">
            <label for="theme" class="form-label">Theme</label>
            <select class="form-select" id="theme" name="theme">
                <option value="Any theme">Any theme</option>
                {% for theme in themes %}
                <option value="{{ theme.name }}">{{ theme.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-4">
            <label for="maxPeople" class="form-label">Max People</label>
            <input type="number" class="form-control" id="maxPeople" name="maxPeople" placeholder="10" min="1">
        </div>

        <div class="col-4 d-flex justify-content-end align-items-end">
            <button type="submit" class="btn lecce-btn lecce-primary-background w-100">
                Search <i class="bi-search"></i>
            </button>
        </div>

    </div>
</form>
