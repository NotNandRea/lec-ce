{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<main class="mx-4 my-5">

    <section>
        <div class="container">

            <div class="row justify-content-center">
                <div class="col-7">

                    <div class="mb-4">
                        <p class="lecce-text-impact lecce-primary-color my-2 fs-6 fw-semibold">JOIN LECC'È</p>

                        <h1 class="display-5 fw-bold lecce-text-impact lecce-secondary-color">Create your profile</h1>
                    </div>

                    <form method="POST" enctype="multipart/form-data" action="{{ url_for('register_post') }}">

                        <div class="row g-4 mb-4">

                            <div class="col-6">

                                <div class="btn lecce-register-checkbox w-100 p-3 rounded-4">
                                    <input type="radio" class="btn-check" name="role" id="participant"
                                        value="participant" checked>
                                    <label class="d-flex flex-row gap-3" for="participant">

                                        <span
                                            class="profile-initials rounded-3 lecce-primary-background text-white d-flex align-items-center justify-content-center"><i
                                                class="bi bi-person"></i></span>

                                        <div class="d-flex flex-column align-items-start">
                                            <span class="fw-bold">I am a traveler</span>
                                            <span class="fs-6">Just explore the city</span>
                                        </div>

                                    </label>
                                </div>

                            </div>

                            <div class="col-6">

                                <div class="btn lecce-register-checkbox w-100 p-3 rounded-4">
                                    <input type="radio" class="btn-check" name="role" id="guide" value="guide">
                                    <label class="d-flex flex-row gap-3" for="guide">

                                        <span
                                            class="profile-initials rounded-3 lecce-primary-background text-white d-flex align-items-center justify-content-center"><i
                                                class="bi bi-geo-alt"></i></span>

                                        <div class="d-flex flex-column align-items-start">
                                            <span class="fw-bold">I am a guide</span>
                                            <span class="fs-6">Create and lead walking tours</span>
                                        </div>

                                    </label>
                                </div>

                            </div>
                        </div>

                        <div class="bg-white rounded-5 shadow p-5">

                            <div class="mb-4">
                                <label for="profile_photo" class="form-label fw-semibold lecce-secondary-color">
                                    <i class="bi bi-camera me-1"></i>
                                    Profile photo
                                </label>

                                <input class="form-control rounded-4 py-3" type="file" id="profile_photo"
                                    name="profile_photo" accept="image/png, image/jpeg, image/jpg">

                                <span class="d-block text-secondary fs-6 mt-2">
                                    Optional - JPG/JPEG or PNG
                                </span>
                            </div>

                            <div class="row g-4">
                                <div class="col-6">
                                    <label for="first_name" class="form-label fw-semibold lecce-secondary-color">
                                        First name <span class="lecce-primary-color">*</span>
                                    </label>

                                    <input type="text" class="form-control rounded-4 py-3" id="first_name"
                                        name="first_name" placeholder="My name is..." required>
                                </div>

                                <div class="col-6">
                                    <label for="last_name" class="form-label fw-semibold lecce-secondary-color">
                                        Last name <span class="lecce-primary-color">*</span>
                                    </label>

                                    <input type="text" class="form-control rounded-4 py-3" id="last_name"
                                        name="last_name" placeholder="My last name is..." required>
                                </div>
                            </div>

                            <div class="mt-3">
                                <label for="email" class="form-label fw-semibold lecce-secondary-color">
                                    <i class="bi bi-envelope me-1"></i>
                                    Email <span class="lecce-primary-color">*</span>
                                </label>

                                <input type="email" class="form-control rounded-4 py-3" id="email" name="email"
                                    placeholder="email@email.com" required>
                            </div>

                            <div class="mt-3">
                                <label for="password" class="form-label fw-semibold lecce-secondary-color">
                                    <i class="bi bi-lock me-1"></i>
                                    Password <span class="lecce-primary-color">*</span>
                                </label>

                                <input type="password" class="form-control rounded-4 py-3" id="password" name="password"
                                    required>

                                <div class="mt-3 fs-6" id="passwordChecklist">

                                    <div class="d-flex align-items-center gap-2 lecce-negative-color"
                                        id="passwordLength">
                                        <i class="bi bi-x"></i>
                                        <span>At least 8 characters</span>
                                    </div>

                                    <div class="d-flex align-items-center gap-2 lecce-negative-color"
                                        id="passwordLetter">
                                        <i class="bi bi-x"></i>
                                        <span>At least one letter</span>
                                    </div>

                                    <div class="d-flex align-items-center gap-2 lecce-negative-color"
                                        id="passwordNumber">
                                        <i class="bi bi-x"></i>
                                        <span>At least one number</span>
                                    </div>

                                    <div class="d-flex align-items-center gap-2 lecce-negative-color"
                                        id="passwordSymbol">
                                        <i class="bi bi-x"></i>
                                        <span>At least one symbol</span>
                                    </div>

                                </div>
                            </div>

                            <div class="mt-4 d-none" id="guideFields">
                                <label class="form-label fw-semibold lecce-secondary-color">
                                    <i class="bi bi-translate me-1"></i>
                                    Languages spoken <span class="lecce-primary-color">*</span>
                                </label>

                                <div class="d-flex flex-wrap gap-3">

                                    <div class="lecce-language-checkbox">
                                        <input class="d-none" type="checkbox" name="languages" value="Italian"
                                            id="italian">
                                        <label class="px-4 py-3 fw-bold w-100 d-flex justify-content-center user-select-none" for="italian">
                                            Italian
                                        </label>
                                    </div>
                                    <div class="lecce-language-checkbox">
                                        <input class="d-none" type="checkbox" name="languages" value="German"
                                            id="german">
                                        <label class="px-4 py-3 fw-bold w-100 d-flex justify-content-center user-select-none" for="german">
                                            German
                                        </label>
                                    </div>
                                    <div class="lecce-language-checkbox">
                                        <input class="d-none" type="checkbox" name="languages" value="English"
                                            id="english">
                                        <label class="px-4 py-3 fw-bold w-100 d-flex justify-content-center user-select-none" for="english">
                                            English
                                        </label>
                                    </div>
                                    <div class="lecce-language-checkbox">
                                        <input class="d-none" type="checkbox" name="languages" value="Spanish"
                                            id="spanish">
                                        <label class="px-4 py-3 fw-bold w-100 d-flex justify-content-center user-select-none" for="spanish">
                                            Spanish
                                        </label>
                                    </div>
                                    <div class="lecce-language-checkbox">
                                        <input class="d-none" type="checkbox" name="languages" value="French"
                                            id="french">
                                        <label class="px-4 py-3 fw-bold w-100 d-flex justify-content-center user-select-none" for="french">
                                            French
                                        </label>
                                    </div>
                                    <div class="lecce-language-checkbox">
                                        <input class="d-none" type="checkbox" name="languages" value="Russian"
                                            id="russian">
                                        <label class="px-4 py-3 fw-bold w-100 d-flex justify-content-center user-select-none" for="russian">
                                            Russian
                                        </label>
                                    </div>

                                </div>
                            </div>

                            <div class="d-flex justify-content-between gap-3 mt-4">
                                <button type="reset"
                                    class="btn lecce-btn lecce-secondary-background py-3fw-bold shadow-sm w-100">
                                    Clear All
                                </button>
                                <button type="submit"
                                    class="btn lecce-btn lecce-primary-background py-3 fw-bold shadow-sm w-100">
                                    Create my profile
                                </button>
                            </div>

                            <p class="fs-6 mt-4 mb-0">
                                Already have an account?
                                <a href="{{ url_for('login') }}"
                                    class="lecce-primary-color fw-bold text-decoration-none">
                                    Sign in
                                </a>
                            </p>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </section>

</main>
{% endblock %}
